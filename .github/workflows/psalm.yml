name: Static analysis

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: psalm-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php-min: ${{ steps.versions.outputs.php-min }}
      ocp-matrix: ${{ steps.versions.outputs.ocp-matrix }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@8a7bac6300b2f0f3100088b297995a229558ddba # v1.3.2

      - name: Check enforcement of minimum PHP version ${{ steps.versions.outputs.php-min }} in psalm.xml
        run: grep 'phpVersion="${{ steps.versions.outputs.php-min }}' psalm.xml

  # Analyses the app against the public API (nextcloud/ocp) of every
  # Nextcloud version it supports
  static-analysis:
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.ocp-matrix) }}

    name: static-psalm-analysis ${{ matrix.ocp-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up php ${{ needs.matrix.outputs.php-min }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ needs.matrix.outputs.php-min }}
          extensions: ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, session, simplexml, xmlreader, xmlwriter, zip, zlib
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # newer versions of nextcloud/ocp may require a newer PHP version than
      # the one the analysis runs on, which does not matter for psalm
      - name: Install nextcloud/ocp ${{ matrix.ocp-version }}
        env:
          OCP_VERSION: ${{ matrix.ocp-version }}
        run: composer require --dev "nextcloud/ocp:$OCP_VERSION" --no-interaction --ignore-platform-reqs --with-dependencies

      - name: Run psalm
        run: composer run psalm -- --monochrome --no-progress --output-format=github
